# Configuración del despliegue en Render.
#
# La base de datos NO está aquí: vive en Neon. El disco de un servicio gratuito
# de Render se borra en cada reinicio, así que una base en fichero perdería el
# progreso de todos cada vez que la app se duerme.
services:
  - type: web
    name: english-app
    runtime: python
    plan: free
    # MISMA region que la base en Neon (us-east-2, Ohio). Cada consulta viaja
    # entre Render y Neon: con la app en Oregon y la base en Ohio, serian ~60 ms
    # de ida y vuelta POR CONSULTA, y algunas paginas hacen una docena.
    region: ohio
    # Sin 'branch': se despliega desde main, que es la rama que corre. El
    # trabajo en curso vive en ramas aparte y solo llega aqui al fusionarse.
    buildCommand: ./build.sh
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /entrar
    envVars:
      # La cadena de conexión de Neon. Se pega en el panel de Render, NUNCA
      # aquí: este fichero sí va a GitHub.
      - key: DATABASE_URL
        sync: false
      # Obliga a que la cookie de sesión viaje solo por HTTPS. Sin esto, viaja
      # en claro y cualquiera en la misma red puede copiarla y entrar como tú.
      - key: COOKIE_SEGURA
        value: "1"
      # El servidor NO genera audio: medido en Render, una frase tarda 24,6 s
      # frente a 1,8 s en un portatil, porque su CPU gratuita es mucho mas
      # lenta. Esperar eso para oir una palabra no sirve de nada. La voz la
      # pone el navegador, que en iPhone y Mac son las voces de Apple.
      - key: TTS_SERVIDOR
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
