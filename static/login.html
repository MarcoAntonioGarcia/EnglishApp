<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Daily English Habit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a111e'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0' fill='none' stroke='%233ccfe6' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 20l4.5-6' stroke='%23f3b54a' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='2' fill='%23e4ebf5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body class="auth deck-grid" data-lamp="cyan">
<div class="room">
  <div class="stage" id="stage"></div>

  <main class="panel">
    <div class="brandline">
      <span class="mark"><svg class="ico" viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5.5"/><circle cx="12" cy="16" r="1.4"/></svg></span>
      <b>Daily English Habit</b>
    </div>
    <h1>Turn on the light, <em>read a little.</em></h1>
    <p class="lede">Reading, vocabulary and writing, one day at a time.</p>

    <div class="sheet">
      <form id="formEntrar">
        <div class="campo">
          <label for="login">Username or email</label>
          <input id="login" name="login" autocomplete="username" required
                 autocapitalize="none" spellcheck="false">
        </div>
        <div class="campo">
          <label for="clave">Password</label>
          <input id="clave" type="password" autocomplete="current-password" required>
        </div>
        <button class="principal" type="submit">Sign in</button>
      </form>
      <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
    </div>

    <p class="pie">
      <a href="/forgot-password">Forgot your password?</a><br>
      New here? <a href="/signup">Create an account</a>
    </p>
  </main>
</div>

<script src="/static/lamp.js"></script>
<script>
const $ = s => document.querySelector(s);
const aviso = $("#aviso");

function decir(texto, tipo){
  aviso.textContent = texto;
  aviso.className = "aviso " + tipo;
}

async function enviar(url, cuerpo, boton){
  boton.disabled = true;
  try{
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(cuerpo),
    });
    const datos = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(typeof datos.detail === "string" ? datos.detail : "Something went wrong. Please try again.");
    return datos;
  } catch(e){
    if (e instanceof TypeError) throw new Error("Can't reach the server. Check your connection and try again.");
    throw e;
  } finally {
    boton.disabled = false;
  }
}

$("#formEntrar").onsubmit = async e => {
  e.preventDefault();
  try{
    const d = await enviar("/api/auth/login",
      {login: $("#login").value.trim(), password: $("#clave").value},
      e.submitter);
    // no Gemini key yet: explain how to get one before entering
    location.href = d.necesita_key ? "/bienvenida" : "/";
  }catch(err){ decir(err.message, "error"); }
};
</script>
</body>
</html>
