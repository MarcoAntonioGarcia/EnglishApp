<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Users · Daily English Habit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a111e'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0' fill='none' stroke='%233ccfe6' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 20l4.5-6' stroke='%23f3b54a' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='2' fill='%23e4ebf5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body{margin:0;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));font:15px/1.5 var(--ui)}
  .caja{max-width:980px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.02em}
  h1 em{font-family:var(--book);font-style:italic;font-weight:500;color:var(--cyan-ink)}
  header a{color:var(--ink-2);font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
  header a:hover{color:var(--ink)}
  .tarjeta{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th{text-align:left;font-size:12.5px;color:var(--ink-3);padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:rgba(255,255,255,.015)}
  .correo{font-weight:600}
  .sub{color:var(--ink-3);font-size:12.5px}
  .sub.num{font-family:var(--num)}
  code{font-family:var(--num);font-size:12.5px;background:var(--bg);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-2)}
  .chip{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .pending{background:var(--amber-wash);color:var(--amber-ink)}
  .active{background:var(--ok-wash);color:var(--ok)}
  .blocked{background:var(--bad-wash);color:var(--bad)}
  .admin{background:var(--blue-wash);color:var(--blue)}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  button{padding:7px 12px;min-height:34px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;
         cursor:pointer;border:1px solid var(--line-2);background:var(--s2);color:var(--ink)}
  button:hover{background:var(--s3)}
  button.ok{background:var(--cyan);color:var(--cyan-deep);border-color:var(--cyan)}
  button.mal{color:var(--bad);border-color:rgba(255,122,114,.4);background:transparent}
  button.mal:hover{background:var(--bad-wash)}
  button:disabled{opacity:.4;cursor:default}
  .vacio{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:14px}
  .aviso{margin-bottom:16px;padding:10px 13px;border-radius:10px;font-size:14px;display:none}
  .aviso.error{background:var(--bad-wash);border:1px solid rgba(255,122,114,.4);color:#ffc1bc;display:block}
  .aviso.ok{background:var(--ok-wash);border:1px solid rgba(79,212,154,.4);color:#bff3da;display:block}
  .crear{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:18px}
  .crear h2{margin:0 0 4px;font-size:16px;font-weight:650}
  .crear p{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}
  .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .campos label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
  .campos input{width:100%;padding:10px 11px;border:1px solid var(--line-2);border-radius:10px;
                font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
  .campos input::placeholder{color:var(--ink-3)}
  .campos input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-wash)}
  .crear .pie2{margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ficha{background:var(--bg);border:1px solid var(--cyan-line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px;display:none}
  .ficha.on{display:block}
</style>
</head>
<body class="deck-grid">
<main class="caja">
  <header>
    <h1>People on <em>Daily English Habit</em></h1>
    <a href="/">← Back to the app</a>
  </header>

  <div class="aviso" id="aviso" role="status"></div>

  <div class="crear">
    <h2>Create an account</h2>
    <p>It starts active: if you create it, you've already decided this person gets in.
       The password is temporary. Share it and ask them to change it in Settings.</p>
    <div class="campos">
      <div>
        <label for="nuevoNombre">Name</label>
        <input id="nuevoNombre" placeholder="Luis Perez">
      </div>
      <div>
        <label for="nuevoUsuario">Username (to sign in)</label>
        <input id="nuevoUsuario" placeholder="luis.perez" autocapitalize="none" spellcheck="false">
      </div>
      <div>
        <label for="nuevaClave">Temporary password</label>
        <input id="nuevaClave" placeholder="at least 10 characters">
      </div>
      <div>
        <label for="nuevoCorreo">Email (optional)</label>
        <input id="nuevoCorreo" placeholder="used only for password resets" autocapitalize="none">
      </div>
    </div>
    <div class="pie2">
      <button class="ok" id="btnCrear">Create account</button>
      <button id="btnSugerir" type="button">Suggest a password</button>
      <span class="sub" id="crearMsg"></span>
    </div>
    <div class="ficha" id="ficha"></div>
  </div>

  <div class="tarjeta">
    <div class="scroll"><table>
      <thead><tr>
        <th>Person</th><th>Status</th><th>Session</th><th>AI key</th><th>Joined</th>
        <th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody id="filas"></tbody>
    </table></div>
    <div class="vacio" id="vacio" hidden>Nobody else has signed up yet.</div>
  </div>
</main>

<script src="/static/ui.js"></script>
<script>
const $ = s => document.querySelector(s);
let yo = null;

// Todo lo que viene de la base y se mete como HTML tiene que pasar por aqui.
// El nombre de una persona es texto libre: si alguien pusiera
// <img src=x onerror=alert(1)> como nombre, el navegador lo EJECUTARIA al
// pintar la tabla. Hoy solo el admin pone nombres, pero el dia que alguien
// pueda cambiarse el suyo esto deja de ser autoinfligido.
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const ETIQUETA = {pending:"Pending", active:"Active", blocked:"Blocked"};

function decir(texto, tipo){
  const a = $("#aviso");
  a.textContent = texto;
  a.className = "aviso " + tipo;
  if(tipo === "ok") setTimeout(() => { a.className = "aviso"; }, 3500);
}

async function llamar(url, cuerpo){
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cuerpo),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Couldn't complete it.");
  return d;
}

function acciones(u){
  const soyYo = yo && u.id === yo.id;
  const b = [];
  if(u.status === "pending")
    b.push(`<button class="ok" data-a="active" data-id="${u.id}">Approve</button>`);
  if(u.status === "active" && !soyYo)
    b.push(`<button class="mal" data-a="blocked" data-id="${u.id}">Block</button>`);
  if(u.status === "blocked")
    b.push(`<button class="ok" data-a="active" data-id="${u.id}">Reactivate</button>`);
  if(u.sesiones) b.push(`<button class="mal" data-a="cerrar" data-id="${u.id}">Sign out</button>`);
  b.push(`<button data-a="nombre" data-id="${u.id}">Rename</button>`);
  b.push(`<button data-a="clave" data-id="${u.id}">Reset password</button>`);
  return b.join("");
}

function pintar(usuarios){
  $("#filas").innerHTML = usuarios.map(u => `
    <tr>
      <td>
        <div class="correo">${esc(u.nombre || u.username)}</div>
        <div class="sub">
          ${u.role === "admin" ? '<span class="chip admin">Admin</span> ' : ""}
          signs in as <code>${esc(u.username)}</code>
        </div>
      </td>
      <td><span class="chip ${u.status}">${ETIQUETA[u.status] || u.status}</span></td>
      <td class="sub">${u.sesiones
        ? "in since " + esc((u.sesion_desde || "").slice(5, 16))
        : "signed out"}</td>
      <td class="sub">${esc(u.tiene_clave_gemini ? u.pista_clave_gemini : "—")}</td>
      <td class="sub num">${esc((u.created_at || "").slice(0, 10))}</td>
      <td><div class="acciones">${acciones(u)}</div></td>
    </tr>`).join("");
  $("#vacio").hidden = usuarios.length > 1;
}

async function cargar(){
  const r = await fetch("/api/admin/users");
  if(r.status === 401) return location.href = "/entrar";
  if(!r.ok) return decir("Couldn't load the list.", "error");
  pintar(await r.json());
}

$("#filas").addEventListener("click", async e => {
  const b = e.target.closest("button");
  if(!b) return;
  const id = Number(b.dataset.id);
  b.disabled = true;
  try{
    if(b.dataset.a === "cerrar"){
      const d = await llamar(`/api/admin/users/${id}/sesiones/cerrar`, {});
      decir("Sessions closed: " + d.cerradas + ". They will need to sign in again.", "ok");
      await cargar();
      return;
    }
    if(b.dataset.a === "nombre"){
      const fila = (await (await fetch("/api/admin/users")).json()).find(x => x.id === id) || {};
      const nombre = await uiPrompt("The name shown inside the app.", fila.nombre || "", {title:"Display name", ok:"Next"});
      if(nombre === null) return;
      const usuario = await uiPrompt("The username they sign in with. If you change it, tell them.",
                             fila.username || "", {title:"Username", ok:"Save"});
      if(usuario === null) return;
      await llamar(`/api/admin/users/${id}/identidad`, {nombre, username: usuario});
      decir("Renamed. Tell them their new username if you changed it.", "ok");
      await cargar();
      return;
    }
    if(b.dataset.a === "clave"){
      const clave = await uiPrompt("At least 10 characters. Their open sessions will be closed.", "", {title:"New password", ok:"Reset password"});
      if(clave === null) return;
      await llamar(`/api/admin/users/${id}/password`, {password: clave});
      decir("Password changed and sessions closed.", "ok");
    }else{
      await llamar(`/api/admin/users/${id}/status`, {status: b.dataset.a});
      decir("Done.", "ok");
    }
    await cargar();
  }catch(err){
    decir(err.message, "error");
  }finally{
    b.disabled = false;
  }
});

// Una contraseña temporal decente, para no tener que inventarla cada vez.
// Se genera en el NAVEGADOR con el generador criptográfico: no pasa por el
// servidor hasta que se pulsa Crear.
$("#btnSugerir").onclick = () => {
  const abc = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const n = new Uint32Array(14);
  crypto.getRandomValues(n);
  $("#nuevaClave").value = [...n].map(x => abc[x % abc.length]).join("");
};

$("#btnCrear").onclick = async () => {
  const b = $("#btnCrear"), m = $("#crearMsg"), ficha = $("#ficha");
  const usuario = $("#nuevoUsuario").value.trim();
  const clave = $("#nuevaClave").value;
  m.textContent = "";
  ficha.className = "ficha";
  b.disabled = true;
  try{
    const d = await llamar("/api/admin/users", {
      username: usuario, password: clave,
      nombre: $("#nuevoNombre").value.trim(),
      email: $("#nuevoCorreo").value.trim()});
    // se muestran los datos UNA vez, para poder copiarlos y pasarlos
    ficha.innerHTML = "Account created. Share these details:<br><br>" +
      "Username: <code>" + esc(d.username) + "</code><br>" +
      "Password: <code>" + esc(clave) + "</code>" +
      "<br><br><span class=\"sub\">They won't be shown again. " +
      "If the password gets lost, reset it from the table.</span>";
    ficha.className = "ficha on";
    ["nuevoNombre","nuevoUsuario","nuevaClave","nuevoCorreo"].forEach(i => $("#"+i).value = "");
    await cargar();
  }catch(err){
    m.textContent = err.message;
    m.style.color = "var(--bad)";
  }finally{
    b.disabled = false;
  }
};

fetch("/api/auth/me").then(r => r.json()).then(u => { yo = u; cargar(); });
</script>
</body>
</html>
